<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neural ODE Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --dim: #8b949e;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --blue: #58a6ff;
  --purple: #bc8cff;
  --orange: #ffa657;
  --cyan: #39d353;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 13px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
header h1 span { color: var(--blue); }
.device-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--dim);
  font-family: var(--font-mono);
}
.device-badge.gpu { color: var(--green); border-color: var(--green); }
.device-badge.mps { color: var(--purple); border-color: var(--purple); }

.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-section {
  padding: 10px 12px 6px;
  font-size: 10px;
  font-weight: 700;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.target-list { overflow-y: auto; flex: 1; }
.target-btn {
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 8px 12px;
  background: none;
  border: none;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  text-align: left;
  gap: 2px;
  position: relative;
}
.target-btn:hover { background: var(--bg3); }
.target-btn.active { background: #1f2d3d; border-left: 2px solid var(--blue); }
.target-btn.running .tb-name::after {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--yellow);
  border-radius: 50%;
  margin-left: 6px;
  animation: pulse 1s infinite;
}
.target-btn.done .tb-name::after {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--green);
  border-radius: 50%;
  margin-left: 6px;
}
.target-btn.failed .tb-name::after {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--red);
  border-radius: 50%;
  margin-left: 6px;
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.3; }
}
.tb-name { font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
.tb-desc { font-size: 10px; color: var(--dim); }
.stop-btn {
  position: absolute;
  right: 8px; top: 50%;
  transform: translateY(-50%);
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 3px;
  padding: 2px 6px;
  font-size: 10px;
  cursor: pointer;
  display: none;
}
.target-btn.running .stop-btn { display: block; }

.timing-panel {
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  font-family: var(--font-mono);
  font-size: 10px;
}
.timing-panel .tp-title {
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 9px;
  margin-bottom: 6px;
}
.timing-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
.timing-row .tl { color: var(--dim); }
.timing-row .tv { color: var(--cyan); }

.tabs {
  display: flex;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab {
  padding: 8px 16px;
  font-size: 12px;
  cursor: pointer;
  color: var(--dim);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }

.tab-content { display: none; flex: 1; overflow: hidden; }
.tab-content.active { display: flex; flex-direction: column; }

.terminal-wrap { flex: 1; overflow: hidden; }
#terminal {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  padding: 12px 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  background: var(--bg);
  white-space: pre-wrap;
  word-break: break-all;
}
#terminal .ln { display: block; }
#terminal .ln.metric { color: var(--cyan); }
#terminal .ln.err    { color: var(--red); }
#terminal .ln.warn   { color: var(--yellow); }
#terminal .ln.info   { color: var(--blue); }
#terminal .ln.ok     { color: var(--green); }
#terminal .ln.dim    { color: var(--dim); }
.terminal-toolbar {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.terminal-toolbar span { font-family: var(--font-mono); font-size: 11px; color: var(--dim); }
#clear-btn {
  margin-left: auto;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--dim);
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
}
#clear-btn:hover { color: var(--text); }

.charts-panel {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 16px;
  align-content: start;
}
.chart-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.chart-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 10px;
  gap: 8px;
}
.chart-header h3 {
  font-size: 12px;
  font-weight: 600;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  flex-shrink: 0;
}

/* ── Health bar ── */
.health-bar {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10px;
  min-width: 0;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.hb-current { color: var(--text); font-weight: 600; white-space: nowrap; }
.hb-arrow   { color: var(--dim); }
.hb-target  { color: var(--dim); white-space: nowrap; font-size: 9px; }
.hb-track {
  width: 52px;
  height: 5px;
  background: var(--bg3);
  border-radius: 3px;
  overflow: hidden;
  flex-shrink: 0;
}
.hb-fill {
  height: 100%;
  width: 0%;
  border-radius: 3px;
  transition: width 0.5s ease, background-color 0.5s ease;
}
.hb-label {
  font-size: 9px;
  color: var(--dim);
  white-space: nowrap;
  font-style: italic;
}

/* ── KL health zone badge ── */
.kl-zone {
  font-size: 10px;
  font-family: var(--font-mono);
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 600;
}
.kl-zone.good    { color: var(--green); background: #3fb95022; border: 1px solid #3fb95055; }
.kl-zone.low     { color: var(--red);   background: #f8514922; border: 1px solid #f8514955; }
.kl-zone.high    { color: var(--yellow);background: #d2992222; border: 1px solid #d2992255; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.stat-grid.cols4 { grid-template-columns: repeat(4, 1fr); }
.stat-box {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
}
.stat-box .sb-label { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.8px; }
.stat-box .sb-value { font-size: 18px; font-weight: 700; font-family: var(--font-mono); margin-top: 2px; }
.stat-box .sb-value.green  { color: var(--green); }
.stat-box .sb-value.blue   { color: var(--blue); }
.stat-box .sb-value.orange { color: var(--orange); }
.stat-box .sb-value.purple { color: var(--purple); }
.stat-box .sb-value.red    { color: var(--red); }

.no-data {
  color: var(--dim);
  font-size: 12px;
  text-align: center;
  padding: 40px;
  grid-column: 1/-1;
}

.progress-wrap {
  height: 3px;
  background: var(--bg3);
  border-radius: 2px;
  margin-bottom: 12px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--purple));
  transition: width 0.5s ease;
  border-radius: 2px;
}

.gallery-panel { flex: 1; overflow-y: auto; padding: 16px; }
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}
.gallery-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.gallery-card img { width: 100%; display: block; cursor: zoom-in; }
.gallery-card .gc-name { padding: 6px 10px; font-family: var(--font-mono); font-size: 10px; color: var(--dim); }
.gallery-empty { color: var(--dim); font-size: 12px; text-align: center; padding: 40px; }

#lightbox {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}
#lightbox.show { display: flex; }
#lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 4px; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>Neural <span>ODE</span> Dashboard</h1>
  <div class="device-badge" id="device-badge">device: —</div>
  <div style="margin-left:auto; font-size:11px; color:var(--dim)" id="job-status">idle</div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">Make Targets</div>
    <div class="target-list" id="target-list"></div>
    <div class="timing-panel" id="timing-panel">
      <div class="tp-title">Run Times</div>
      <div id="timing-rows"><div style="color:var(--dim);font-size:10px">No runs yet</div></div>
    </div>
  </aside>

  <div class="main">
    <div class="tabs">
      <div class="tab active" data-tab="terminal">Terminal</div>
      <div class="tab" data-tab="charts">Live Charts</div>
      <div class="tab" data-tab="results">Results</div>
    </div>

    <div class="tab-content active" id="tab-terminal">
      <div class="terminal-wrap">
        <div id="terminal"><span class="ln dim">▸ Select a target to run...</span>
</div>
      </div>
      <div class="terminal-toolbar">
        <span id="term-status">ready</span>
        <button id="clear-btn">clear</button>
      </div>
    </div>

    <div class="tab-content" id="tab-charts">
      <div class="charts-panel" id="charts-panel">
        <div class="no-data">Run a training target to see live charts</div>
      </div>
    </div>

    <div class="tab-content" id="tab-results">
      <div class="gallery-panel">
        <div class="gallery-grid" id="gallery-grid">
          <div class="gallery-empty">No result images yet — run a training target</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="lightbox"><img id="lightbox-img" src="" alt=""></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────

const state = {
  activeTarget: null,
  activeJob: null,
  evtSource: null,
  runTimes: {},
  device: null,
  currentModel: null,
  jobStart: null,
};

const charts = {};
const chartData = {
  spiral:    { iters: [], loss: [], nfe: [] },
  mnist:     {},
  realworld: { epochs: [], train_loss: [], val_loss: [], recon: [], val_recon: [],
               kl: [], val_kl: [], beta: [], nfe: [], time: [] },
};

// ── Reference targets (domain knowledge from Neural ODE paper + practice) ──

const REFS = {
  // Spiral: noise σ=0.05, so theoretical MSE floor is σ²=0.0025
  'spiral-loss': {
    lines: [
      { y: 0.0025, color: '#3fb950', label: 'σ² noise floor' },
      { y: 0.01,   color: '#d29922', label: 'acceptable' },
    ],
    health: { target: 0.003, warn: 0.01, worst: 0.5, lowerBetter: true,
              display: (v) => v.toExponential(3),
              targetLabel: '≤0.003 (noise floor)' },
  },
  'spiral-nfe': {
    lines: [
      { y: 50, color: '#58a6ff', label: 'efficient' },
    ],
    health: null,
  },
  // MNIST: paper reports ODE-Net ~98.2%, ResNet ~98.0%
  'mnist-acc': {
    lines: [
      { y: 98.2, color: '#3fb950', label: 'paper: ODE-Net' },
      { y: 95.0, color: '#d29922', label: 'acceptable' },
    ],
    health: { target: 98.2, warn: 95, worst: 10, lowerBetter: false,
              display: (v) => v.toFixed(1) + '%',
              targetLabel: '98.2% (paper)' },
  },
  'mnist-loss': {
    lines: [
      { y: 0.06, color: '#3fb950', label: 'well converged' },
      { y: 0.15, color: '#d29922', label: 'acceptable' },
    ],
    health: { target: 0.06, warn: 0.15, worst: 2.5, lowerBetter: true,
              display: (v) => v.toFixed(4),
              targetLabel: '≤0.06' },
  },
  'mnist-nfe': {
    lines: [
      { y: 30, color: '#58a6ff', label: 'efficient (dopri5)' },
    ],
    health: null,
  },
  // Realworld: harder to set absolute; recon MSE on normalized ETT data
  'rw-recon': {
    lines: [
      { y: 0.10, color: '#3fb950', label: 'target MSE' },
      { y: 0.25, color: '#d29922', label: 'acceptable' },
    ],
    health: { target: 0.10, warn: 0.25, worst: 1.5, lowerBetter: true,
              display: (v) => v.toFixed(4),
              targetLabel: '≤0.10' },
  },
  // KL: collapse < 0.05, explode > 5; ideal 0.3–3.0
  'rw-kl': {
    lines: [
      { y: 0.05, color: '#f85149', label: 'collapse zone', dash: [4, 2] },
      { y: 3.0,  color: '#d29922', label: 'diverging zone', dash: [4, 2] },
    ],
    health: null,  // special zone health handled separately
  },
  'rw-nfe': {
    lines: [
      { y: 50, color: '#58a6ff', label: 'efficient' },
    ],
    health: null,
  },
};

// ── Chart.js helpers ───────────────────────────────────────────────────────

function annotLine(y, color, label, dash = [6, 3]) {
  return {
    type: 'line',
    yMin: y, yMax: y,
    borderColor: color,
    borderWidth: 1.5,
    borderDash: dash,
    label: {
      display: true,
      content: label,
      color: color,
      backgroundColor: 'rgba(13,17,23,0.85)',
      font: { size: 9 },
      position: 'end',
      padding: { x: 4, y: 2 },
    },
  };
}

function buildAnnotations(refKey) {
  const ref = REFS[refKey];
  if (!ref || !ref.lines) return {};
  const out = {};
  ref.lines.forEach((l, i) => {
    out['ref' + i] = annotLine(l.y, l.color, l.label, l.dash || [6, 3]);
  });
  return out;
}

const BASE_SCALES = {
  x: { ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: '#21262d' } },
  y: { ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: '#21262d' } },
};

function makeChart(canvasId, type, data, extraOpts = {}) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return null;
  if (charts[canvasId]) { try { charts[canvasId].destroy(); } catch(e){} }

  const options = {
    responsive: true,
    animation: false,
    plugins: {
      legend: { labels: { color: '#8b949e', font: { size: 10 } } },
      annotation: { annotations: {} },
      ...(extraOpts.plugins || {}),
    },
    scales: {
      x: BASE_SCALES.x,
      y: BASE_SCALES.y,
      ...(extraOpts.scales || {}),
    },
  };

  charts[canvasId] = new Chart(canvas, { type, data, options });
  return charts[canvasId];
}

function ds(label, data, color, extra = {}) {
  return Object.assign({
    label, data,
    borderColor: color,
    backgroundColor: color + '22',
    borderWidth: 1.5,
    pointRadius: 0,
    tension: 0.3,
    fill: false,
  }, extra);
}

// ── Health bar ─────────────────────────────────────────────────────────────

function healthBarHTML(id, targetLabel) {
  return `<div class="health-bar" id="health-${id}">
    <span class="hb-current">—</span>
    <span class="hb-arrow">→</span>
    <span class="hb-target">${targetLabel}</span>
    <div class="hb-track"><div class="hb-fill"></div></div>
  </div>`;
}

function computeHealth(current, target, worst, lowerBetter) {
  if (lowerBetter) {
    if (current <= target) return 1;
    if (current >= worst)  return 0;
    return (worst - current) / (worst - target);
  } else {
    if (current >= target) return 1;
    if (current <= worst)  return 0;
    return (current - worst) / (target - worst);
  }
}

function klHealth(kl) {
  if (kl <= 0)    return 0;
  if (kl < 0.05)  return kl / 0.05 * 0.3;         // 0..0.3  (danger: collapse)
  if (kl <= 3.0)  return 0.7 + (kl - 0.05) / (3.0 - 0.05) * 0.3; // 0.7..1.0
  if (kl <= 5.0)  return 1.0 - (kl - 3.0) / 2.0 * 0.6;  // 1.0..0.4
  return 0;
}

function healthColor(h) {
  if (h >= 0.75) return '#3fb950';
  if (h >= 0.45) return '#d29922';
  return '#f85149';
}

function updateHealth(refKey, currentValue) {
  const ref = REFS[refKey];
  if (!ref || !ref.health) return;
  const h = ref.health;
  const el = document.getElementById('health-' + refKey);
  if (!el) return;

  const health = computeHealth(currentValue, h.target, h.worst, h.lowerBetter);
  el.querySelector('.hb-current').textContent = h.display(currentValue);
  const fill = el.querySelector('.hb-fill');
  fill.style.width = Math.round(health * 100) + '%';
  fill.style.backgroundColor = healthColor(health);
}

function updateKLHealth(kl) {
  const el = document.getElementById('health-rw-kl');
  if (!el) return;
  const h = klHealth(kl);
  const zone = kl < 0.05 ? 'low' : kl > 3.0 ? 'high' : 'good';
  const zoneText = kl < 0.05 ? 'KL collapse!' : kl > 3.0 ? 'KL too high' : 'KL healthy';
  el.className = 'kl-zone ' + zone;
  el.textContent = `${kl.toFixed(3)} — ${zoneText}`;
}

// ── Tabs ───────────────────────────────────────────────────────────────────

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'results') loadResults();
  });
});

// ── Targets ────────────────────────────────────────────────────────────────

async function loadTargets() {
  const res = await fetch('/api/targets');
  const targets = await res.json();
  const list = document.getElementById('target-list');
  list.innerHTML = '';
  targets.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'target-btn';
    btn.id = 'btn-' + t.id;
    btn.innerHTML = `
      <span class="tb-name">${t.label}</span>
      <span class="tb-desc">${t.desc}</span>
      <button class="stop-btn" onclick="stopJob(event,'${t.id}')">■ stop</button>`;
    btn.addEventListener('click', (e) => { if (!e.target.classList.contains('stop-btn')) runTarget(t.id); });
    list.appendChild(btn);
  });
}

// ── Terminal ───────────────────────────────────────────────────────────────

function termAppend(text, cls) {
  const term = document.getElementById('terminal');
  const span = document.createElement('span');
  span.className = 'ln' + (cls ? ' ' + cls : '');
  span.textContent = text;
  term.appendChild(span);
  term.appendChild(document.createTextNode('\n'));
  term.scrollTop = term.scrollHeight;
}

function termClear() { document.getElementById('terminal').innerHTML = ''; }

function classifyLine(t) {
  const l = t.toLowerCase();
  if (/error|traceback|exception|failed/.test(l)) return 'err';
  if (/warning/.test(l)) return 'warn';
  if (/device:|epoch |iter |training |done\.|test |results saved/.test(l)) return 'metric';
  if (/\bok\b|pass|success/.test(l)) return 'ok';
  if (/^={3,}/.test(t)) return 'info';
  return '';
}

document.getElementById('clear-btn').addEventListener('click', termClear);

// ── Run ────────────────────────────────────────────────────────────────────

async function runTarget(targetId) {
  if (state.activeJob) {
    await fetch('/api/stop/' + state.activeJob, { method: 'POST' });
    if (state.evtSource) { state.evtSource.close(); state.evtSource = null; }
  }

  resetChartData(targetId);
  termClear();
  termAppend('▸ make ' + targetId, 'info');
  state.activeTarget = targetId;

  document.querySelectorAll('.target-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-' + targetId);
  if (btn) btn.classList.add('active', 'running');
  document.getElementById('job-status').textContent = 'running: ' + targetId;

  const res = await fetch('/api/run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ target: targetId }),
  });
  const { job_id } = await res.json();
  state.activeJob = job_id;
  state.jobStart = Date.now();
  streamJob(job_id, targetId);
}

function resetChartData(targetId) {
  chartData.spiral    = { iters: [], loss: [], nfe: [] };
  chartData.mnist     = {};
  chartData.realworld = { epochs: [], train_loss: [], val_loss: [], recon: [], val_recon: [],
                          kl: [], val_kl: [], beta: [], nfe: [], time: [] };
  state.currentModel = null;
  document.getElementById('charts-panel').innerHTML = '<div class="no-data">Waiting for data...</div>';
  Object.keys(charts).forEach(k => { try { charts[k].destroy(); } catch(e){} delete charts[k]; });
}

// ── SSE stream ─────────────────────────────────────────────────────────────

function streamJob(jobId, targetId) {
  const es = new EventSource('/api/stream/' + jobId);
  state.evtSource = es;

  es.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.keepalive) return;

    const text = msg.text || '';
    termAppend(text, classifyLine(text));

    if (msg.metric) handleMetric(msg.metric, targetId);

    if (msg.done) {
      es.close();
      state.evtSource = null;
      state.activeJob = null;

      const elapsed = ((Date.now() - state.jobStart) / 1000).toFixed(1);
      state.runTimes[targetId] = elapsed;
      updateTimingPanel();

      const btn = document.getElementById('btn-' + targetId);
      if (btn) { btn.classList.remove('running'); btn.classList.add(msg.rc === 0 ? 'done' : 'failed'); }
      document.getElementById('job-status').textContent =
        `${targetId} — ${msg.rc === 0 ? '✓ done' : '✗ failed'} in ${elapsed}s`;
      loadResults();
    }
  };
  es.onerror = () => { es.close(); state.evtSource = null; };
}

async function stopJob(e, targetId) {
  e.stopPropagation();
  if (state.activeJob) {
    await fetch('/api/stop/' + state.activeJob, { method: 'POST' });
    termAppend('[stopped by user]', 'warn');
    const btn = document.getElementById('btn-' + targetId);
    if (btn) btn.classList.remove('running');
    document.getElementById('job-status').textContent = 'stopped';
  }
}

// ── Metric handler ─────────────────────────────────────────────────────────

function handleMetric(m, targetId) {
  if (m.type === 'device') {
    state.device = m.device;
    const badge = document.getElementById('device-badge');
    badge.textContent = 'device: ' + m.device;
    badge.className = 'device-badge ' + (m.device.startsWith('cuda') ? 'gpu' : m.device === 'mps' ? 'mps' : '');
    return;
  }
  if (m.type === 'model_start') {
    state.currentModel = m.model;
    if (!chartData.mnist[m.model])
      chartData.mnist[m.model] = { epochs: [], loss: [], train_acc: [], test_acc: [], nfe: [], time: [] };
    ensureMNISTCharts();
    return;
  }
  if (m.type === 'spiral') {
    chartData.spiral.iters.push(m.iter);
    chartData.spiral.loss.push(m.loss);
    chartData.spiral.nfe.push(m.nfe);
    ensureSpiralCharts();
    updateSpiralCharts();
    updateStatBox('stat-loss', m.loss.toExponential(3), 'green');
    updateStatBox('stat-nfe',  m.nfe, 'blue');
    updateStatBox('stat-prog', Math.round(100 * m.iter / m.total) + '%', 'orange');
    updateProgress(m.iter / m.total);
    updateHealth('spiral-loss', m.loss);
    return;
  }
  if (m.type === 'mnist') {
    const model = state.currentModel || 'Unknown';
    if (!chartData.mnist[model])
      chartData.mnist[model] = { epochs: [], loss: [], train_acc: [], test_acc: [], nfe: [], time: [] };
    const d = chartData.mnist[model];
    d.epochs.push(m.epoch); d.loss.push(m.loss); d.train_acc.push(m.train_acc);
    d.test_acc.push(m.test_acc); d.nfe.push(m.nfe === -1 ? null : m.nfe); d.time.push(m.time);
    ensureMNISTCharts();
    updateMNISTCharts();
    updateStatBox('stat-loss', m.loss.toExponential(3), 'green');
    updateStatBox('stat-nfe',  m.nfe === -1 ? 'N/A' : m.nfe, 'blue');
    updateStatBox('stat-prog', `ep ${m.epoch}/${m.total}`, 'orange');
    updateStatBox('stat-acc',  m.test_acc.toFixed(1) + '%', 'purple');
    updateProgress(m.epoch / m.total);
    updateHealth('mnist-acc',  m.test_acc);
    updateHealth('mnist-loss', m.loss);
    return;
  }
  if (m.type === 'realworld') {
    const d = chartData.realworld;
    d.epochs.push(m.epoch);     d.train_loss.push(m.train_loss); d.val_loss.push(m.val_loss);
    d.recon.push(m.recon);      d.val_recon.push(m.val_recon);
    d.kl.push(m.kl);            d.val_kl.push(m.val_kl);
    d.beta.push(m.beta);        d.nfe.push(m.nfe);               d.time.push(m.time);
    ensureRealworldCharts();
    updateRealworldCharts();
    updateStatBox('stat-loss', m.train_loss.toFixed(4), 'green');
    updateStatBox('stat-val',  m.val_loss.toFixed(4), 'blue');
    updateStatBox('stat-prog', `ep ${m.epoch}/${m.total}`, 'orange');
    updateStatBox('stat-nfe',  m.nfe, 'purple');
    updateProgress(m.epoch / m.total);
    updateHealth('rw-recon', m.recon);
    updateKLHealth(m.kl);
    return;
  }
}

function updateMNISTCharts() {
  const models = Object.keys(chartData.mnist);
  const maxLen = Math.max(...models.map(m => chartData.mnist[m].epochs.length), 0);

  ['chart-mnist-acc','chart-mnist-loss','chart-mnist-nfe','chart-mnist-time'].forEach(id => {
    const c = charts[id];
    if (!c) return;
    c.data.labels = Array.from({length: maxLen}, (_, i) => i + 1);
    c.data.datasets = [];
  });

  models.forEach(model => {
    const d = chartData.mnist[model];
    const col = MODEL_COLORS[model] || '#3fb950';
    charts['chart-mnist-acc'] ?.data.datasets.push(ds(model, d.test_acc, col));
    charts['chart-mnist-loss']?.data.datasets.push(ds(model, d.loss, col));
    charts['chart-mnist-nfe'] ?.data.datasets.push(ds(model + ' NFE', d.nfe, col));
    charts['chart-mnist-time']?.data.datasets.push(ds(model + ' t(s)', d.time, col));
  });

  ['chart-mnist-acc','chart-mnist-loss','chart-mnist-nfe','chart-mnist-time'].forEach(id => {
    charts[id]?.update('none');
  });
}

    'chart-rw-kl':    [[d.kl, 0],         [d.val_kl, 1]],
    'chart-rw-beta':  [[d.beta, 0]],
    'chart-rw-nfe':   [[d.nfe, 0]],
    'chart-rw-time':  [[d.time, 0]],
  };

    const c = charts[id];

    series.forEach(([data, idx]) => { if (c.data.datasets[idx]) c.data.datasets[idx].data = data; });
